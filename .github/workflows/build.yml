name: Build TotK Native APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Скачивание кода и библиотек
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Установка Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Принятие лицензий Android SDK
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true

      - name: Права на запуск Gradle
        run: chmod +x gradlew

      - name: Сборка контрольного APK
        run: ./gradlew assembleDebug

      - name: Выгрузка готового APK
        uses: actions/upload-artifact@v4
        with:
          name: TotK-Native-APK
          path: app/build/outputs/apk/debug/*.apk
