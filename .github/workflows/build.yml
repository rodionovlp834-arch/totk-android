name: Build TotK Native APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Скачивание кода и библиотек
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Установка Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Принятие лицензий Android SDK
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true

      - name: Сборка контрольного APK
        run: |
          GRADLEW=$(find . -maxdepth 3 -name "gradlew" | head -n 1)
          if [ -n "$GRADLEW" ]; then
            cd "$(dirname "$GRADLEW")"
            chmod +x gradlew
            ./gradlew assembleDebug
          else
            SETTINGS=$(find . -maxdepth 3 -name "settings.gradle*" | head -n 1)
            cd "$(dirname "$SETTINGS")"
            gradle assembleDebug
          fi

      - name: Выгрузка готового APK
        uses: actions/upload-artifact@v4
        with:
          name: TotK-Native-APK
          path: "**/build/outputs/apk/debug/*.apk"
