name: Build TotK Native APK (30 FPS)

on:
  workflow_dispatch:
    inputs:
      adpf_mode:
        description: 'ADPF: full = все игровые потоки в сессии, legacy = как в стоке'
        type: choice
        options:
          - full
          - legacy
        default: full
      adpf_target_ms:
        description: 'Цель ADPF, мс. Меньше = больше запас по кадру, но горячее. 33.3 = сток'
        type: string
        default: '24.0'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Скачивание репозитория
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Установка Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Установка Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Установка .NET 10 SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Фиксация .NET 10 SDK (вместо 11.0.100)
        run: |
          SDK10=$(dotnet --list-sdks | awk '/^10\./ {print $1}' | sort -V | tail -n 1)
          if [ -z "$SDK10" ]; then
            echo "ОШИБКА: .NET 10 SDK не найден"
            dotnet --list-sdks
            exit 1
          fi
          printf '{\n  "sdk": {\n    "version": "%s",\n    "rollForward": "latestPatch"\n  }\n}\n' "$SDK10" > ../global.json
          for d in $(dotnet --list-sdks | awk '/^11\./ {gsub(/[\[\]]/, "", $2); print $2 "/" $1}'); do
            sudo rm -rf "$d"
          done
          echo "Активная версия dotnet: $(dotnet --version)"

      - name: Установка зависимостей сборки
        run: |
          pip install cryptography==50.0.2
          sudo apt-get update -qq
          sudo apt-get install -y -qq cmake ninja-build nasm yasm pkg-config autoconf automake libtool unzip clang lld zlib1g-dev

      - name: Установка Android NDK r28 и SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "ndk;28.2.13676358" \
            "platforms;android-35" \
            "build-tools;35.0.0"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/build-tools/35.0.0" >> "$GITHUB_PATH"

      - name: Извлечение драйвера Turnip из релиза v1.0.1
        run: |
          curl -fL "https://github.com/AurelioB/totk-android/releases/download/v1.0.1/TotK-Native-1.0.1.apk" -o /tmp/ref.apk
          unzip -q /tmp/ref.apk -d /tmp/ref_apk
          TURNIP_PATH=$(find /tmp/ref_apk -type f -exec sha256sum {} + | awk '$1=="9b87afeb3d8d30c6a0ad5aab3e0703bc1500e0321e9f17a922106fa556389ec6" {sub(/^[^ ]+ +/, ""); print; exit}')
          if [ -z "$TURNIP_PATH" ]; then
            echo "ОШИБКА: драйвер Turnip с нужным SHA-256 не найден"
            exit 1
          fi
          cp "$TURNIP_PATH" /tmp/turnip_driver.so

      - name: Создание временного ключа подписи (.p12)
        env:
          APK_KEY_PASS: totk-build-pass-1234
        run: |
          openssl req -x509 -newkey rsa:2048 \
            -keyout /tmp/key.pem -out /tmp/cert.pem \
            -days 10000 -nodes -subj "/CN=TotKCustom"
          openssl pkcs12 -export \
            -out /tmp/release.p12 \
            -inkey /tmp/key.pem -in /tmp/cert.pem \
            -name totk -passout env:APK_KEY_PASS

      - name: Применение конфигурации (60Hz lock + ADPF под 30 FPS + -O3/ThinLTO)
        env:
          ADPF_MODE: ${{ inputs.adpf_mode }}
          ADPF_TARGET_MS: ${{ inputs.adpf_target_ms }}
        run: |
          # 1. Стоковый android_perf.c
          for c in $(git log --format=%H -- games/totk/runtime/android_perf.c); do
            if ! git show "$c:games/totk/runtime/android_perf.c" | grep -q 'is_not_zero' \
               && git show "$c:games/totk/runtime/android_perf.c" | tail -n 5 | grep -q '^#endif'; then
              git show "$c:games/totk/runtime/android_perf.c" > games/totk/runtime/android_perf.c
              echo "Восстановлен стоковый android_perf.c из $c"
              break
            fi
          done

          # 2. Стоковый android_thermal.c
          for c in $(git log --format=%H -- games/totk/runtime/android_thermal.c); do
            if git show "$c:games/totk/runtime/android_thermal.c" | grep -q 'launch = e && !strcmp(e, "1");'; then
              git show "$c:games/totk/runtime/android_thermal.c" > games/totk/runtime/android_thermal.c
              echo "Восстановлен стоковый android_thermal.c из $c"
              break
            fi
          done

          # 3. Чистый TotkActivity.java из истории
          for c in $(git log --format=%H -- games/totk/android/java/com/aure/totk/TotkActivity.java); do
            if ! git show "$c:games/totk/android/java/com/aure/totk/TotkActivity.java" | grep -q 'keep120HzDisplay'; then
              git show "$c:games/totk/android/java/com/aure/totk/TotkActivity.java" > games/totk/android/java/com/aure/totk/TotkActivity.java
              echo "Восстановлен чистый TotkActivity.java из $c"
              break
            fi
          done

          python3 - <<'PY'
          import os
          from pathlib import Path

          summary = []

          def note(msg):
              print(msg)
              summary.append(msg)

          mode_req = os.environ.get('ADPF_MODE', 'full').strip()
          target_ms = float(os.environ.get('ADPF_TARGET_MS', '24.0').strip().replace(',', '.'))
          assert mode_req in ('full', 'legacy'), 'adpf_mode должен быть full или legacy'
          assert 10.0 <= target_ms <= 34.0, 'adpf_target_ms должен быть в диапазоне 10..34'

          # 1. android_perf.c: режим ADPF и цель длительности кадра под 30 FPS
          pf = Path('games/totk/runtime/android_perf.c')
          pt = pf.read_text()

          if mode_req == 'full':
              old_mode = 'mode = request && !strcmp(request, "0") ? 0 : request && !strcmp(request, "full") ? 2 : 1;'
              new_mode = 'mode = request && !strcmp(request, "0") ? 0 : (request && (!strcmp(request, "1") || !strcmp(request, "legacy"))) ? 1 : 2;'
              assert old_mode in pt, 'Строка mode не найдена в android_perf.c'
              pt = pt.replace(old_mode, new_mode, 1)
              note('ADPF режим: full (все игровые потоки в сессии) - ПРИМЕНЕНО')
          else:
              note('ADPF режим: legacy (сток) - без изменений')

          old_ms = 'double ms = target && *target ? atof(target) : 33.3;'
          new_ms = 'double ms = target && *target ? atof(target) : %.1f;' % target_ms
          if old_ms in pt:
              pt = pt.replace(old_ms, new_ms, 1)
              note('Цель ADPF: %.1f мс - ПРИМЕНЕНО' % target_ms)
          else:
              note('ВНИМАНИЕ: строка с целью 33.3 мс не найдена в android_perf.c - цель осталась стоковой')

          pf.write_text(pt)

          # 2. TotkActivity.java: жёсткий замок окна на 60 Гц + запрет сна экрана
          ja = Path('games/totk/android/java/com/aure/totk/TotkActivity.java')
          jt = ja.read_text()
          if jt.startswith('Package '):
              jt = 'package ' + jt[8:]
          if 'WindowManager' not in jt:
              jt = jt.replace('import android.view.View;', 'import android.view.View;\nimport android.view.WindowManager;', 1)

          lock_method = """
              private void lock60HzDisplay() {
                  getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);
                  Display display = getDisplay();
                  if (display == null) return;
                  Display.Mode current = display.getMode();
                  if (current == null) return;
                  Display.Mode target = current;
                  float bestDiff = Math.abs(current.getRefreshRate() - 60.0f);
                  for (Display.Mode m : display.getSupportedModes()) {
                      if (m.getPhysicalWidth() == current.getPhysicalWidth()
                              && m.getPhysicalHeight() == current.getPhysicalHeight()) {
                          float diff = Math.abs(m.getRefreshRate() - 60.0f);
                          if (diff < bestDiff) {
                              bestDiff = diff;
                              target = m;
                          }
                      }
                  }
                  WindowManager.LayoutParams lp = getWindow().getAttributes();
                  if (lp.preferredDisplayModeId != target.getModeId() || lp.preferredRefreshRate != target.getRefreshRate()) {
                      lp.preferredDisplayModeId = target.getModeId();
                      lp.preferredRefreshRate = target.getRefreshRate();
                      getWindow().setAttributes(lp);
                  }
              }
          """
          jt = jt.replace('@Override protected void onCreate(Bundle state) {', lock_method + '\n    @Override protected void onCreate(Bundle state) {', 1)
          jt = jt.replace('super.onCreate(state);', 'super.onCreate(state);\n        lock60HzDisplay();', 1)
          jt = jt.replace('resumed = true;', 'resumed = true;\n        lock60HzDisplay();', 1)
          jt = jt.replace('super.onWindowFocusChanged(focused);', 'super.onWindowFocusChanged(focused);\n        if (focused) lock60HzDisplay();', 1)
          ja.write_text(jt)
          note('Замок окна на 60 Гц (lock60HzDisplay) - ПРИМЕНЁН')

          # 3. Оптимизация компилятора (-O3 + ThinLTO)
          mk = Path('games/totk/android/Makefile')
          mt = mk.read_text()
          old_o2 = 'COMMON := $(PREFIX_MAP) -O2 -g $(PICFLAG)'
          if old_o2 in mt:
              mk.write_text(mt.replace(old_o2, 'COMMON := $(PREFIX_MAP) -O3 -g $(PICFLAG)', 1))
              note('Компилятор: -O3 - ПРИМЕНЕНО')
          else:
              note('ВНИМАНИЕ: строка COMMON с -O2 не найдена в Makefile')
          br = Path('games/totk/android/build_release.py')
          bt = br.read_text()
          old_gpu = "'GPU=vk', f'DEV_BUILD={0 if release else 1}'"
          if old_gpu in bt:
              br.write_text(bt.replace(old_gpu, "'GPU=vk', 'LTO=thin', f'DEV_BUILD={0 if release else 1}'", 1))
              note('Компилятор: ThinLTO - ПРИМЕНЕНО')
          else:
              note('ВНИМАНИЕ: строка GPU=vk не найдена в build_release.py')

          sp = os.environ.get('GITHUB_STEP_SUMMARY')
          if sp:
              with open(sp, 'a', encoding='utf-8') as f:
                  f.write('### Применённая конфигурация\n')
                  for s in summary:
                      f.write('- ' + s + '\n')
          PY

          # Справка для следующей настройки: какие переменные читает порт и где задаются
          {
            echo '### Переменные TOTK_/DM_, которые читает порт'
            echo '```'
            grep -rhoE '(getenv|is_one|nonzero|differs|option)\("(TOTK|DM)_[A-Z0-9_]+"' games/totk --include='*.c' --include='*.h' --include='*.cpp' 2>/dev/null | sed -E 's/^[^"]*"//; s/"$//' | sort -u | tr '\n' ' ' || true
            echo
            echo '```'
            echo '### android_perf.c: режим и цель ADPF'
            echo '```'
            grep -nE 'getenv|mode =|double ms' games/totk/runtime/android_perf.c | head -n 40 || true
            echo '```'
            echo '### Где задаются параметры темпа кадров'
            echo '```'
            grep -rn -E 'TOTK_PRESENT_SLOTS|DM_PRESENT_(HZ|INTERVAL)|TOTK_REALTIME' games/totk --include='*.java' --include='*.py' --include='*.sh' --include='*.env' --include='*.json' 2>/dev/null | head -n 40 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Сборка APK
        env:
          APK_KEY_PASS: totk-build-pass-1234
        run: |
          run_build() {
            python3 games/totk/android/build_release.py \
              --ndk "$ANDROID_HOME/ndk/28.2.13676358" \
              --turnip /tmp/turnip_driver.so \
              --key /tmp/release.p12 \
              --key-pass-env APK_KEY_PASS \
              -o /tmp/totk-native.apk
          }

          show_errors() {
            echo "=== ТОЧНЫЕ ОШИБКИ ИЗ ЛОГОВ ==="
            grep -n -C 2 -E "error:|undefined symbol|ld\.lld:|Stop\." games/totk/build/release/logs/*.log 2>/dev/null | tail -n 60 || true
          }

          if ! run_build; then
            echo ">>> Сборка с ThinLTO не прошла, переключаюсь на -O3 без LTO..."
            show_errors
            git checkout -- games/totk/android/build_release.py
            rm -rf games/totk/build/release/native-release
            if ! run_build; then
              echo ">>> Сборка с -O3 без LTO тоже не прошла:"
              show_errors
              exit 1
            fi
          fi

          mkdir -p out
          cp /tmp/totk-native.apk out/totk-native.apk

      - name: Выгрузка готового APK
        uses: actions/upload-artifact@v4
        with:
          name: TotK-Native-30fps-${{ inputs.adpf_mode }}-${{ inputs.adpf_target_ms }}
          path: out/totk-native.apk
