name: Build TotK Native APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Скачивание кода и библиотек
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Установка Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Настройка Android SDK и NDK
        uses: android-actions/setup-android@v3

      - name: Права на запуск Gradle
        run: chmod +x gradlew

      - name: Сборка Release APK
        run: ./gradlew assembleRelease

      - name: Выгрузка готового APK
        uses: actions/upload-artifact@v4
        with:
          name: TotK-Native-Release
          path: app/build/outputs/apk/release/*.apk
