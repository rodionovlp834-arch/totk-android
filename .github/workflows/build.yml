name: Build TotK Native APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Скачивание кода и библиотек
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Установка Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Установка Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Настройка Android SDK, NDK и build-tools
        run: |
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
          NDK_DIR=$(ls -d "$ANDROID_HOME/ndk/"* 2>/dev/null | sort -V | tail -n 1)
          if [ -n "$NDK_DIR" ]; then
            echo "ANDROID_NDK_HOME=$NDK_DIR" >> $GITHUB_ENV
            echo "ANDROID_NDK_ROOT=$NDK_DIR" >> $GITHUB_ENV
            echo "NDK_HOME=$NDK_DIR" >> $GITHUB_ENV
          fi
          BT_DIR=$(ls -d "$ANDROID_HOME/build-tools/"* 2>/dev/null | sort -V | tail -n 1)
          if [ -n "$BT_DIR" ]; then
            echo "$BT_DIR" >> $GITHUB_PATH
          fi

      - name: Сборка APK через build_app.py
        run: |
          python3 build_app.py || {
            echo "=== СПРАВКА build_app.py ==="
            python3 build_app.py --help || true
            exit 1
          }

      - name: Выгрузка готового APK
        uses: actions/upload-artifact@v4
        with:
          name: TotK-Native-APK
          path: "**/*.apk"
